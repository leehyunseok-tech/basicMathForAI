<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="1" y="1" width="798" height="328" rx="8" fill="#f7f8f5" stroke="#d6dad1"/>
  <text x="30" y="38" font-size="15" fill="#7b838d">AI 논문에서 실제로 자주 보는 그리스 문자는 이 정도가 전부입니다</text>

  <g font-size="14">
    <rect x="30" y="58" width="740" height="34" fill="#191d24"/>
    <text x="60" y="80" fill="#ffffff" font-size="13">기호</text>
    <text x="150" y="80" fill="#ffffff" font-size="13">읽는 법</text>
    <text x="270" y="80" fill="#ffffff" font-size="13">AI에서 보통 이런 뜻</text>

    <rect x="30" y="92" width="740" height="38" fill="#ffffff" stroke="#e4e7df"/>
    <text x="60" y="117" font-size="20" fill="#3a45a0">θ</text>
    <text x="150" y="117" fill="#191d24">세타</text>
    <text x="270" y="117" fill="#4d5561">모델이 학습하는 값 전체 (파라미터)</text>

    <rect x="30" y="130" width="740" height="38" fill="#f7f8f5" stroke="#e4e7df"/>
    <text x="60" y="155" font-size="20" fill="#3a45a0">η</text>
    <text x="150" y="155" fill="#191d24">에타</text>
    <text x="270" y="155" fill="#4d5561">학습률 — 한 번에 얼마나 크게 움직일지</text>

    <rect x="30" y="168" width="740" height="38" fill="#ffffff" stroke="#e4e7df"/>
    <text x="60" y="193" font-size="20" fill="#3a45a0">σ</text>
    <text x="150" y="193" fill="#191d24">시그마 (소문자)</text>
    <text x="270" y="193" fill="#4d5561">표준편차, 또는 시그모이드 함수</text>

    <rect x="30" y="206" width="740" height="38" fill="#f7f8f5" stroke="#e4e7df"/>
    <text x="60" y="231" font-size="20" fill="#3a45a0">Σ</text>
    <text x="150" y="231" fill="#191d24">시그마 (대문자)</text>
    <text x="270" y="231" fill="#4d5561">전부 더하기 — for 루프와 같습니다</text>

    <rect x="30" y="244" width="740" height="38" fill="#ffffff" stroke="#e4e7df"/>
    <text x="60" y="269" font-size="20" fill="#3a45a0">∂</text>
    <text x="150" y="269" fill="#191d24">라운드 / 델</text>
    <text x="270" y="269" fill="#4d5561">편미분 — 하나만 조금 움직여 보기</text>

    <rect x="30" y="282" width="740" height="38" fill="#f7f8f5" stroke="#e4e7df"/>
    <text x="60" y="307" font-size="20" fill="#3a45a0">α, λ</text>
    <text x="150" y="307" fill="#191d24">알파, 람다</text>
    <text x="270" y="307" fill="#4d5561">사람이 정해 주는 조절 값</text>
  </g>
</svg>
