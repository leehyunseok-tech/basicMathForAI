<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" width="800" height="290" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="1" y="1" width="798" height="288" rx="8" fill="#f7f8f5" stroke="#d6dad1"/>
  <text x="30" y="38" font-size="15" fill="#7b838d">아래 첨자는 “몇 번째인가”, 위 첨자는 보통 “몇 층인가” 또는 거듭제곱</text>

  <g>
    <text x="40" y="76" font-size="13.5" fill="#4d5561">데이터가 이렇게 있을 때</text>
    <rect x="40" y="88" width="300" height="34" fill="#191d24"/>
    <text x="60" y="110" fill="#ffffff" font-size="13">번호</text>
    <text x="150" y="110" fill="#ffffff" font-size="13">키(cm)</text>
    <text x="250" y="110" fill="#ffffff" font-size="13">기호</text>

    <rect x="40" y="122" width="300" height="32" fill="#ffffff" stroke="#e4e7df"/>
    <text x="60" y="143" font-size="13.5" fill="#191d24">1번</text><text x="150" y="143" font-size="13.5" fill="#191d24">172</text>
    <text x="250" y="143" font-size="15" fill="#3a45a0">x₁</text>

    <rect x="40" y="154" width="300" height="32" fill="#f7f8f5" stroke="#e4e7df"/>
    <text x="60" y="175" font-size="13.5" fill="#191d24">2번</text><text x="150" y="175" font-size="13.5" fill="#191d24">165</text>
    <text x="250" y="175" font-size="15" fill="#3a45a0">x₂</text>

    <rect x="40" y="186" width="300" height="32" fill="#ffffff" stroke="#e4e7df"/>
    <text x="60" y="207" font-size="13.5" fill="#191d24">3번</text><text x="150" y="207" font-size="13.5" fill="#191d24">180</text>
    <text x="250" y="207" font-size="15" fill="#3a45a0">x₃</text>

    <text x="40" y="244" font-size="13.5" fill="#4d5561">i번째를 가리킬 때는 </text>
    <text x="190" y="244" font-size="16" fill="#3a45a0">xᵢ</text>
    <text x="40" y="268" font-size="13" fill="#7b838d">코드로는 그냥 x[i] 입니다.</text>
  </g>

  <g>
    <rect x="380" y="72" width="376" height="146" rx="4" fill="#e5e7f4" stroke="#3a45a0"/>
    <text x="400" y="100" font-size="14" fill="#4d5561">위 첨자에 괄호가 있으면 거듭제곱이 아닙니다</text>
    <text x="400" y="136" font-size="19" fill="#191d24">W⁽¹⁾, W⁽²⁾</text>
    <text x="400" y="162" font-size="13.5" fill="#4d5561">→ 1층의 W, 2층의 W (제곱 아님)</text>
    <text x="400" y="194" font-size="13.5" fill="#a2661c">괄호가 없으면 &#160;W² = W × W &#160;(제곱)</text>
  </g>
  <text x="380" y="248" font-size="13" fill="#7b838d">이 구분만 알아도 신경망 수식의 절반은 덜 무섭습니다.</text>
</svg>
