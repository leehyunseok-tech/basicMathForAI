<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="1" y="1" width="798" height="298" rx="8" fill="#f7f8f5" stroke="#d6dad1"/>
  <text x="30" y="36" font-size="15" fill="#7b838d">택시 요금 — 기본요금 4,000원 + 1km당 1,000원</text>

  <g>
    <rect x="30" y="60" width="290" height="32" fill="#191d24"/>
    <text x="60" y="82" fill="#ffffff" font-size="13">거리 (km)</text>
    <text x="200" y="82" fill="#ffffff" font-size="13">요금 (원)</text>
    <rect x="30" y="92" width="290" height="30" fill="#ffffff" stroke="#e4e7df"/>
    <text x="60" y="112" font-size="13.5" fill="#191d24">0</text><text x="200" y="112" font-size="13.5" fill="#4d5561">4,000</text>
    <rect x="30" y="122" width="290" height="30" fill="#f7f8f5" stroke="#e4e7df"/>
    <text x="60" y="142" font-size="13.5" fill="#191d24">1</text><text x="200" y="142" font-size="13.5" fill="#4d5561">5,000</text>
    <rect x="30" y="152" width="290" height="30" fill="#ffffff" stroke="#e4e7df"/>
    <text x="60" y="172" font-size="13.5" fill="#191d24">2</text><text x="200" y="172" font-size="13.5" fill="#4d5561">6,000</text>
    <rect x="30" y="182" width="290" height="30" fill="#f7f8f5" stroke="#e4e7df"/>
    <text x="60" y="202" font-size="13.5" fill="#191d24">3</text><text x="200" y="202" font-size="13.5" fill="#4d5561">7,000</text>

    <rect x="30" y="228" width="290" height="46" rx="4" fill="#e5e7f4" stroke="#3a45a0"/>
    <text x="175" y="257" font-size="17" fill="#3a45a0" text-anchor="middle">요금 = 1000 × 거리 + 4000</text>
  </g>

  <g>
    <line x1="400" y1="250" x2="760" y2="250" stroke="#191d24" stroke-width="1.6"/>
    <line x1="400" y1="250" x2="400" y2="70" stroke="#191d24" stroke-width="1.6"/>
    <text x="760" y="272" font-size="12.5" fill="#191d24" text-anchor="end">거리(km)</text>
    <text x="400" y="60" font-size="12.5" fill="#191d24" text-anchor="middle">요금</text>

    <g font-size="11.5" fill="#7b838d" text-anchor="middle">
      <text x="470" y="268">1</text><text x="540" y="268">2</text><text x="610" y="268">3</text><text x="680" y="268">4</text>
    </g>
    <text x="392" y="196" font-size="11.5" fill="#a2661c" text-anchor="end">4,000</text>

    <line x1="400" y1="192" x2="750" y2="192" stroke="#d6dad1" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="400" y1="192" x2="715" y2="80" stroke="#3a45a0" stroke-width="2.5"/>
    <circle cx="400" cy="192" r="6" fill="#a2661c"/>
    <text x="414" y="182" font-size="12" fill="#a2661c">출발 전에 이미 4,000원</text>

    <circle cx="470" cy="167" r="4.5" fill="#3a45a0"/>
    <circle cx="540" cy="142" r="4.5" fill="#3a45a0"/>
    <circle cx="610" cy="117" r="4.5" fill="#3a45a0"/>
    <text x="640" y="106" font-size="12" fill="#3a45a0">1km마다 같은 만큼 오름</text>
  </g>
</svg>
