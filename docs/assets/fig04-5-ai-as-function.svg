<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" width="800" height="290" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="1" y="1" width="798" height="288" rx="8" fill="#f7f8f5" stroke="#d6dad1"/>
  <text x="30" y="36" font-size="15" fill="#7b838d">“AI 모델”이라는 말은 결국 함수 하나를 가리킵니다. 상자가 클 뿐입니다.</text>

  <g>
    <rect x="40" y="66" width="128" height="86" rx="4" fill="#ffffff" stroke="#d6dad1"/>
    <text x="104" y="104" font-size="13" fill="#4d5561" text-anchor="middle">사진 한 장</text>
    <text x="104" y="128" font-size="11.5" fill="#7b838d" text-anchor="middle">(숫자 수십만 개)</text>
    <text x="104" y="170" font-size="12.5" fill="#3a45a0" text-anchor="middle">입력 x</text>
  </g>
  <path d="M176 108 H222" stroke="#191d24" stroke-width="1.8"/><path d="M216 103 L224 108 L216 113 z" fill="#191d24"/>

  <rect x="232" y="60" width="300" height="98" rx="6" fill="#e5e7f4" stroke="#3a45a0" stroke-width="2"/>
  <text x="382" y="96" font-size="17" fill="#191d24" text-anchor="middle">이미지 분류 모델</text>
  <text x="382" y="124" font-size="12.5" fill="#4d5561" text-anchor="middle">안에 든 숫자 2,300만 개가</text>
  <text x="382" y="142" font-size="12.5" fill="#4d5561" text-anchor="middle">정해진 순서대로 곱하고 더합니다</text>
  <text x="382" y="180" font-size="12.5" fill="#3a45a0" text-anchor="middle">함수 f</text>

  <path d="M542 108 H588" stroke="#191d24" stroke-width="1.8"/><path d="M582 103 L590 108 L582 113 z" fill="#191d24"/>
  <g>
    <rect x="598" y="66" width="160" height="86" rx="4" fill="#ffffff" stroke="#0f7864"/>
    <text x="678" y="98" font-size="14" fill="#0f7864" text-anchor="middle">고양이 92%</text>
    <text x="678" y="122" font-size="13" fill="#7b838d" text-anchor="middle">강아지 6%</text>
    <text x="678" y="170" font-size="12.5" fill="#0f7864" text-anchor="middle">출력 y</text>
  </g>

  <rect x="40" y="206" width="718" height="62" rx="4" fill="#ffffff" stroke="#d6dad1"/>
  <text x="60" y="232" font-size="14" fill="#191d24">챗봇도, 번역기도, 추천 시스템도 전부 같은 그림입니다.</text>
  <text x="60" y="256" font-size="13" fill="#7b838d">다른 건 상자 안의 숫자와 크기뿐 — 구조는 f(x) = y 하나입니다.</text>
</svg>
