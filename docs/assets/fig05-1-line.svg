<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="1" y="1" width="798" height="298" rx="8" fill="#f7f8f5" stroke="#d6dad1"/>
  <text x="30" y="36" font-size="15" fill="#7b838d">y = ax + b — 이 식에는 손잡이가 딱 두 개 있습니다</text>

  <g stroke="#e4e7df" stroke-width="1">
    <line x1="120" y1="80" x2="120" y2="256"/><line x1="180" y1="80" x2="180" y2="256"/>
    <line x1="240" y1="80" x2="240" y2="256"/><line x1="300" y1="80" x2="300" y2="256"/>
    <line x1="360" y1="80" x2="360" y2="256"/>
    <line x1="60" y1="100" x2="420" y2="100"/><line x1="60" y1="140" x2="420" y2="140"/>
    <line x1="60" y1="180" x2="420" y2="180"/>
  </g>
  <line x1="60" y1="220" x2="430" y2="220" stroke="#191d24" stroke-width="1.8"/>
  <line x1="60" y1="256" x2="60" y2="76" stroke="#191d24" stroke-width="1.8"/>
  <text x="440" y="224" font-size="13" fill="#191d24">x</text>
  <text x="52" y="70" font-size="13" fill="#191d24" text-anchor="middle">y</text>

  <line x1="60" y1="180" x2="400" y2="87" stroke="#3a45a0" stroke-width="2.8"/>

  <circle cx="60" cy="180" r="6" fill="#a2661c"/>
  <text x="72" y="200" font-size="13" fill="#a2661c">b — 출발점 (x가 0일 때의 y)</text>

  <line x1="180" y1="147" x2="240" y2="147" stroke="#0f7864" stroke-width="1.8"/>
  <line x1="240" y1="147" x2="240" y2="130" stroke="#0f7864" stroke-width="1.8"/>
  <text x="210" y="164" font-size="12" fill="#0f7864" text-anchor="middle">오른쪽 1</text>
  <text x="252" y="140" font-size="12" fill="#0f7864">위로 a</text>

  <rect x="470" y="90" width="296" height="132" rx="4" fill="#ffffff" stroke="#d6dad1"/>
  <text x="490" y="120" font-size="15" fill="#191d24">손잡이 두 개</text>
  <text x="490" y="152" font-size="14" fill="#0f7864">a &#160;기울기 — 얼마나 가파른가</text>
  <text x="490" y="180" font-size="14" fill="#a2661c">b &#160;절편 — 어디서 출발하는가</text>
  <text x="490" y="206" font-size="12.5" fill="#7b838d">이 둘만 정하면 직선이 하나로 정해집니다.</text>

  <text x="30" y="284" font-size="13" fill="#7b838d">Chapter 05가 하려는 일: 이 a와 b를 데이터로부터 “찾아내는 것”이 곧 학습입니다.</text>
</svg>
