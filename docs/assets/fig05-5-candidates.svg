      <circle cx="170" cy="124" r="4"/><circle cx="200" cy="112" r="4"/><circle cx="230" cy="98" r="4"/>
    </g>
    <line x1="60" y1="176" x2="244" y2="88" stroke="#0f7864" stroke-width="2.4"/>
    <text x="150" y="228" font-size="13.5" fill="#0f7864" text-anchor="middle">좋다 — 점들을 잘 따라감</text>
  </g>

  <g>
