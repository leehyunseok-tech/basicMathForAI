      <circle cx="426" cy="124" r="4"/><circle cx="456" cy="112" r="4"/><circle cx="486" cy="98" r="4"/>
    </g>
    <line x1="316" y1="140" x2="500" y2="140" stroke="#a2661c" stroke-width="2.4"/>
    <text x="406" y="228" font-size="13.5" fill="#a2661c" text-anchor="middle">나쁘다 — 기울기가 안 맞음</text>
  </g>

  <g>
    <rect x="542" y="56" width="228" height="150" rx="4" fill="#ffffff" stroke="#d6dad1"/>
