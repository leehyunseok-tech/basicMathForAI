<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="1" y="1" width="798" height="248" rx="8" fill="#f7f8f5" stroke="#d6dad1"/>
  <text x="30" y="36" font-size="15" fill="#7b838d">그런데 선은 무수히 많이 그을 수 있습니다. 어느 게 “좋은” 선일까요?</text>

  <g>
    <rect x="30" y="56" width="240" height="150" rx="4" fill="#ffffff" stroke="#d6dad1"/>
    <line x1="52" y1="180" x2="252" y2="180" stroke="#191d24" stroke-width="1.2"/>
