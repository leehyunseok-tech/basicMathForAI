<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="1" y="1" width="798" height="278" rx="8" fill="#f7f8f5" stroke="#d6dad1"/>
  <text x="30" y="36" font-size="15" fill="#7b838d">y = x² — 제곱하면 이런 골짜기 모양이 나옵니다</text>

  <g stroke="#e4e7df" stroke-width="1">
    <line x1="150" y1="70" x2="150" y2="230"/><line x1="210" y1="70" x2="210" y2="230"/>
    <line x1="330" y1="70" x2="330" y2="230"/><line x1="390" y1="70" x2="390" y2="230"/>
    <line x1="90" y1="120" x2="450" y2="120"/><line x1="90" y1="170" x2="450" y2="170"/>
  </g>
  <line x1="90" y1="230" x2="460" y2="230" stroke="#191d24" stroke-width="1.6"/>
  <line x1="270" y1="250" x2="270" y2="66" stroke="#191d24" stroke-width="1.6"/>
  <text x="468" y="234" font-size="13" fill="#191d24">x</text>
  <text x="270" y="58" font-size="13" fill="#191d24" text-anchor="middle">y</text>
  <g font-size="11.5" fill="#7b838d" text-anchor="middle">
    <text x="150" y="248">−2</text><text x="210" y="248">−1</text><text x="330" y="248">1</text><text x="390" y="248">2</text>
  </g>

  <path d="M150 90 Q270 310 390 90" fill="none" stroke="#3a45a0" stroke-width="2.8"/>
  <circle cx="270" cy="230" r="7" fill="#a2661c"/>
  <text x="286" y="222" font-size="13" fill="#a2661c">바닥 (가장 낮은 곳)</text>

  <rect x="500" y="72" width="268" height="164" rx="4" fill="#ffffff" stroke="#d6dad1"/>
  <text x="520" y="102" font-size="14.5" fill="#191d24">왜 U자가 될까</text>
  <text x="520" y="132" font-size="13.5" fill="#4d5561">2² = 4 &#160;&#160;(오른쪽으로 가면 커짐)</text>
  <text x="520" y="158" font-size="13.5" fill="#4d5561">(−2)² = 4 &#160;(왼쪽으로 가도 커짐)</text>
  <text x="520" y="188" font-size="13.5" fill="#3a45a0">제곱하면 부호가 사라지니까</text>
  <text x="520" y="212" font-size="13.5" fill="#3a45a0">양쪽 다 위로 올라갑니다.</text>

  <text x="30" y="266" font-size="13" fill="#7b838d">이 “바닥이 하나뿐인 골짜기” 모양이 AI 학습에서 결정적인 역할을 합니다.</text>
</svg>
