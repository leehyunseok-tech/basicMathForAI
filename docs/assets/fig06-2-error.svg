<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" width="800" height="290" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="1" y="1" width="798" height="288" rx="8" fill="#f7f8f5" stroke="#d6dad1"/>
  <text x="30" y="36" font-size="15" fill="#7b838d">오차 = 실제 점과 예측선 사이의 세로 거리</text>

  <line x1="70" y1="240" x2="470" y2="240" stroke="#191d24" stroke-width="1.6"/>
  <line x1="70" y1="240" x2="70" y2="66" stroke="#191d24" stroke-width="1.6"/>
  <line x1="86" y1="212" x2="450" y2="94" stroke="#3a45a0" stroke-width="2.6"/>
  <text x="380" y="88" font-size="12.5" fill="#3a45a0">예측선</text>

  <g stroke="#a2661c" stroke-width="2" stroke-dasharray="4 3">
    <line x1="130" y1="198" x2="130" y2="174"/>
    <line x1="190" y1="178" x2="190" y2="206"/>
    <line x1="250" y1="159" x2="250" y2="140"/>
    <line x1="310" y1="140" x2="310" y2="172"/>
    <line x1="370" y1="120" x2="370" y2="108"/>
  </g>
  <g fill="#191d24">
    <circle cx="130" cy="174" r="5.5"/><circle cx="190" cy="206" r="5.5"/><circle cx="250" cy="140" r="5.5"/>
    <circle cx="310" cy="172" r="5.5"/><circle cx="370" cy="108" r="5.5"/>
  </g>
  <text x="142" y="168" font-size="11.5" fill="#a2661c">+</text>
  <text x="200" y="204" font-size="11.5" fill="#a2661c">−</text>
  <text x="262" y="136" font-size="11.5" fill="#a2661c">+</text>
  <text x="320" y="170" font-size="11.5" fill="#a2661c">−</text>
  <text x="382" y="104" font-size="11.5" fill="#a2661c">+</text>

  <rect x="510" y="70" width="258" height="180" rx="4" fill="#ffffff" stroke="#d6dad1"/>
  <text x="530" y="100" font-size="14.5" fill="#191d24">오차 = 실제 − 예측</text>
  <text x="530" y="132" font-size="13.5" fill="#4d5561">점이 선 위에 있으면 &#160;<tspan fill="#0f7864">+</tspan></text>
  <text x="530" y="158" font-size="13.5" fill="#4d5561">점이 선 아래 있으면 &#160;<tspan fill="#a2661c">−</tspan></text>
  <text x="530" y="192" font-size="13" fill="#a2661c">그런데 그냥 더하면</text>
  <text x="530" y="214" font-size="13" fill="#a2661c">+와 −가 서로 상쇄돼서</text>
  <text x="530" y="236" font-size="13" fill="#a2661c">오차가 0처럼 보입니다.</text>

  <text x="30" y="276" font-size="13" fill="#7b838d">이 문제를 해결하는 방법이 다음 절의 “제곱”입니다.</text>
</svg>
