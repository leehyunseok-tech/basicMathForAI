<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="1" y="1" width="798" height="328" rx="8" fill="#f7f8f5" stroke="#d6dad1"/>
  <text x="30" y="36" font-size="15" fill="#7b838d">기울기 w를 바꿔가며 “총 오차”를 재면 — 또 골짜기가 나타납니다</text>

  <g>
    <text x="130" y="68" font-size="12.5" fill="#a2661c" text-anchor="middle">w = 3 (너무 가파름)</text>
    <rect x="46" y="78" width="168" height="104" rx="4" fill="#ffffff" stroke="#d6dad1"/>
    <line x1="62" y1="166" x2="200" y2="166" stroke="#191d24" stroke-width="1"/>
    <line x1="62" y1="166" x2="62" y2="90" stroke="#191d24" stroke-width="1"/>
    <line x1="62" y1="162" x2="140" y2="90" stroke="#a2661c" stroke-width="2"/>
    <g fill="#191d24"><circle cx="86" cy="154" r="3"/><circle cx="114" cy="146" r="3"/><circle cx="142" cy="136" r="3"/><circle cx="170" cy="126" r="3"/></g>
    <text x="130" y="198" font-size="12" fill="#a2661c" text-anchor="middle">오차 큼</text>
  </g>
  <g>
    <text x="322" y="68" font-size="12.5" fill="#0f7864" text-anchor="middle">w = 1 (딱 맞음)</text>
    <rect x="238" y="78" width="168" height="104" rx="4" fill="#e5e7f4" stroke="#3a45a0"/>
    <line x1="254" y1="166" x2="392" y2="166" stroke="#191d24" stroke-width="1"/>
    <line x1="254" y1="166" x2="254" y2="90" stroke="#191d24" stroke-width="1"/>
    <line x1="254" y1="162" x2="386" y2="118" stroke="#0f7864" stroke-width="2"/>
    <g fill="#191d24"><circle cx="278" cy="154" r="3"/><circle cx="306" cy="146" r="3"/><circle cx="334" cy="136" r="3"/><circle cx="362" cy="126" r="3"/></g>
    <text x="322" y="198" font-size="12" fill="#0f7864" text-anchor="middle">오차 작음</text>
  </g>
  <g>
    <text x="514" y="68" font-size="12.5" fill="#a2661c" text-anchor="middle">w = 0 (평평함)</text>
    <rect x="430" y="78" width="168" height="104" rx="4" fill="#ffffff" stroke="#d6dad1"/>
    <line x1="446" y1="166" x2="584" y2="166" stroke="#191d24" stroke-width="1"/>
    <line x1="446" y1="166" x2="446" y2="90" stroke="#191d24" stroke-width="1"/>
    <line x1="446" y1="150" x2="578" y2="150" stroke="#a2661c" stroke-width="2"/>
    <g fill="#191d24"><circle cx="470" cy="154" r="3"/><circle cx="498" cy="146" r="3"/><circle cx="526" cy="136" r="3"/><circle cx="554" cy="126" r="3"/></g>
    <text x="514" y="198" font-size="12" fill="#a2661c" text-anchor="middle">오차 큼</text>
  </g>

  <path d="M622 130 H656" stroke="#3a45a0" stroke-width="1.6"/><path d="M651 125 L658 130 L651 135 z" fill="#3a45a0"/>
  <text x="700" y="118" font-size="12.5" fill="#3a45a0" text-anchor="middle">이 오차들을</text>
  <text x="700" y="140" font-size="12.5" fill="#3a45a0" text-anchor="middle">아래처럼 찍어보면</text>

  <line x1="140" y1="300" x2="660" y2="300" stroke="#191d24" stroke-width="1.6"/>
  <line x1="140" y1="300" x2="140" y2="224" stroke="#191d24" stroke-width="1.6"/>
  <text x="400" y="322" font-size="12.5" fill="#191d24" text-anchor="middle">기울기 w →</text>
  <text x="126" y="222" font-size="12.5" fill="#191d24" text-anchor="end">총 오차</text>

  <path d="M180 232 Q400 384 620 232" fill="none" stroke="#3a45a0" stroke-width="2.8"/>
  <circle cx="180" cy="232" r="5" fill="#a2661c"/>
  <circle cx="620" cy="232" r="5" fill="#a2661c"/>
  <circle cx="400" cy="300" r="7" fill="#0f7864"/>
  <text x="400" y="284" font-size="12.5" fill="#0f7864" text-anchor="middle">바닥 = 가장 좋은 w</text>
</svg>
