<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="1" y="1" width="798" height="278" rx="8" fill="#f7f8f5" stroke="#d6dad1"/>
  <text x="30" y="36" font-size="15" fill="#7b838d">e는 2.718... 이라는 그냥 숫자입니다. AI 수식에 계속 나오니 얼굴만 익혀 두세요.</text>

  <rect x="30" y="60" width="330" height="176" rx="4" fill="#ffffff" stroke="#d6dad1"/>
  <text x="195" y="94" font-size="14" fill="#4d5561" text-anchor="middle">e = 2.71828...</text>
  <text x="195" y="126" font-size="12.5" fill="#7b838d" text-anchor="middle">π(3.14...)처럼 정해져 있는 상수</text>
  <line x1="60" y1="210" x2="330" y2="210" stroke="#191d24" stroke-width="1.2"/>
  <line x1="150" y1="220" x2="150" y2="146" stroke="#191d24" stroke-width="1.2"/>
  <path d="M62 208 C110 204, 150 196, 190 176 C224 158, 250 152, 268 148" fill="none" stroke="#3a45a0" stroke-width="2.2"/>
  <text x="280" y="166" font-size="13" fill="#3a45a0">e&#8339;</text>

  <rect x="384" y="60" width="386" height="176" rx="4" fill="#e5e7f4" stroke="#3a45a0"/>
  <text x="577" y="92" font-size="14" fill="#3a45a0" text-anchor="middle">e가 들어가면 이런 S자를 만들 수 있습니다</text>
  <line x1="420" y1="180" x2="740" y2="180" stroke="#191d24" stroke-width="1.2"/>
  <line x1="580" y1="204" x2="580" y2="112" stroke="#191d24" stroke-width="1.2"/>
  <path d="M424 176 C500 176, 545 172, 580 148 C615 124, 660 120, 736 120" fill="none" stroke="#0f7864" stroke-width="2.6"/>
  <line x1="420" y1="120" x2="740" y2="120" stroke="#d6dad1" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="412" y="124" font-size="11" fill="#7b838d" text-anchor="end">1</text>
  <text x="412" y="184" font-size="11" fill="#7b838d" text-anchor="end">0</text>
  <text x="577" y="222" font-size="12.5" fill="#0f7864" text-anchor="middle">시그모이드 — 무엇을 넣어도 0과 1 사이로</text>

  <text x="30" y="264" font-size="13" fill="#7b838d">지금은 “e가 있으면 저런 부드러운 곡선이 나온다” 정도면 충분합니다. Chapter 08에서 제대로 봅니다.</text>
</svg>
