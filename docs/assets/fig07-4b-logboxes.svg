<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="1" y="1" width="798" height="398" rx="8" fill="#f7f8f5" stroke="#d6dad1"/>
  <text x="30" y="36" font-size="15" fill="#7b838d">log 기호는 “몇 제곱하면 ○가 될까”를 묻는 것입니다</text>

  <rect x="40" y="56" width="440" height="40" rx="6" fill="#ffffff" stroke="#0f7864" stroke-width="1.6"/>
  <text x="60" y="82" font-size="17" fill="#191d24">log</text>
  <text x="86" y="87" font-size="11" fill="#191d24">2</text>
  <circle cx="112" cy="76" r="13" fill="none" stroke="#0f7864" stroke-dasharray="3 2"/>
  <text x="134" y="82" font-size="15" fill="#191d24">= (2를 몇 제곱하면</text>
  <circle cx="316" cy="76" r="13" fill="none" stroke="#0f7864" stroke-dasharray="3 2"/>
  <text x="338" y="82" font-size="15" fill="#191d24">가 될까)</text>
  <path d="M112 50 L150 30" stroke="#0f7864" stroke-width="1.2"/>
  <text x="156" y="28" font-size="12" fill="#0f7864">알고 싶은 수</text>

  <g font-size="15">
    <rect x="40" y="112" width="180" height="34" rx="5" fill="#ffffff" stroke="#0f7864"/>
    <text x="58" y="135" fill="#191d24">log</text><text x="84" y="140" font-size="10" fill="#191d24">2</text>
    <circle cx="106" cy="129" r="12" fill="none" stroke="#0f7864" stroke-dasharray="3 2"/><text x="106" y="134" text-anchor="middle" fill="#191d24" font-size="13">2</text>
    <text x="132" y="135" fill="#191d24">= 1</text>
    <path d="M226 129 L242 121 L242 137 z" fill="#3a45a0"/>
    <rect x="242" y="112" width="200" height="34" rx="4" fill="#3a45a0"/>
    <text x="258" y="135" font-size="13.5" fill="#ffffff">2를 1제곱하면</text>
    <circle cx="404" cy="129" r="12" fill="none" stroke="#ffffff" stroke-dasharray="3 2"/><text x="404" y="134" text-anchor="middle" fill="#ffffff" font-size="13">2</text>

    <rect x="40" y="156" width="180" height="34" rx="5" fill="#ffffff" stroke="#0f7864"/>
    <text x="58" y="179" fill="#191d24">log</text><text x="84" y="184" font-size="10" fill="#191d24">2</text>
    <circle cx="106" cy="173" r="12" fill="none" stroke="#0f7864" stroke-dasharray="3 2"/><text x="106" y="178" text-anchor="middle" fill="#191d24" font-size="13">4</text>
    <text x="132" y="179" fill="#191d24">= 2</text>
    <path d="M226 173 L242 165 L242 181 z" fill="#3a45a0"/>
    <rect x="242" y="156" width="200" height="34" rx="4" fill="#3a45a0"/>
    <text x="258" y="179" font-size="13.5" fill="#ffffff">2를 2제곱하면</text>
    <circle cx="404" cy="173" r="12" fill="none" stroke="#ffffff" stroke-dasharray="3 2"/><text x="404" y="178" text-anchor="middle" fill="#ffffff" font-size="13">4</text>

    <rect x="40" y="200" width="180" height="34" rx="5" fill="#ffffff" stroke="#0f7864"/>
    <text x="58" y="223" fill="#191d24">log</text><text x="84" y="228" font-size="10" fill="#191d24">2</text>
    <circle cx="106" cy="217" r="12" fill="none" stroke="#0f7864" stroke-dasharray="3 2"/><text x="106" y="222" text-anchor="middle" fill="#191d24" font-size="13">8</text>
    <text x="132" y="223" fill="#191d24">= 3</text>
    <path d="M226 217 L242 209 L242 225 z" fill="#3a45a0"/>
    <rect x="242" y="200" width="200" height="34" rx="4" fill="#3a45a0"/>
    <text x="258" y="223" font-size="13.5" fill="#ffffff">2를 3제곱하면</text>
    <circle cx="404" cy="217" r="12" fill="none" stroke="#ffffff" stroke-dasharray="3 2"/><text x="404" y="222" text-anchor="middle" fill="#ffffff" font-size="13">8</text>

    <rect x="40" y="244" width="180" height="34" rx="5" fill="#ffffff" stroke="#0f7864"/>
    <text x="58" y="267" fill="#191d24">log</text><text x="84" y="272" font-size="10" fill="#191d24">2</text>
    <circle cx="108" cy="261" r="13" fill="none" stroke="#0f7864" stroke-dasharray="3 2"/><text x="108" y="266" text-anchor="middle" fill="#191d24" font-size="12">16</text>
    <text x="134" y="267" fill="#191d24">= 4</text>
    <path d="M226 261 L242 253 L242 269 z" fill="#3a45a0"/>
    <rect x="242" y="244" width="200" height="34" rx="4" fill="#3a45a0"/>
    <text x="258" y="267" font-size="13.5" fill="#ffffff">2를 4제곱하면</text>
    <circle cx="406" cy="261" r="13" fill="none" stroke="#ffffff" stroke-dasharray="3 2"/><text x="406" y="266" text-anchor="middle" fill="#ffffff" font-size="12">16</text>
  </g>

  <rect x="500" y="112" width="268" height="166" rx="4" fill="#e5e7f4" stroke="#3a45a0"/>
  <text x="634" y="142" font-size="13.5" fill="#3a45a0" text-anchor="middle">밑이 바뀌어도 똑같습니다</text>
  <text x="520" y="176" font-size="14" fill="#191d24">log₁₀ 100 = 2</text>
  <text x="640" y="176" font-size="12" fill="#7b838d">10을 2제곱하면 100</text>
  <text x="520" y="206" font-size="14" fill="#191d24">log₃ 9 = 2</text>
  <text x="640" y="206" font-size="12" fill="#7b838d">3을 2제곱하면 9</text>
  <text x="520" y="236" font-size="14" fill="#191d24">log₅ 125 = 3</text>
  <text x="640" y="236" font-size="12" fill="#7b838d">5를 3제곱하면 125</text>
  <text x="634" y="266" font-size="12" fill="#3a45a0" text-anchor="middle">아래 작은 숫자가 “무엇을” 곱할지입니다</text>

  <rect x="40" y="298" width="728" height="86" rx="4" fill="#ffffff" stroke="#d6dad1"/>
  <text x="60" y="326" font-size="13.5" fill="#191d24">읽는 순서: <tspan fill="#0f7864">log(아래 숫자)를 (안쪽 숫자)만큼 만들려면 몇 제곱?</tspan></text>
  <text x="60" y="354" font-size="13" fill="#4d5561">log₂ 32 → “2를 몇 제곱하면 32가 될까?” → 2×2×2×2×2 = 32 → 답은 5</text>
  <text x="60" y="376" font-size="12.5" fill="#7b838d">기호가 낯설 뿐, 하는 일은 이 질문 하나입니다.</text>
</svg>
