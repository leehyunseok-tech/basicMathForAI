<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="1" y="1" width="798" height="298" rx="8" fill="#f7f8f5" stroke="#d6dad1"/>
  <text x="30" y="36" font-size="15" fill="#7b838d">y = log₁₀x 의 그래프 — 오른쪽 위로 “완만하게” 증가합니다</text>

  <g stroke="#e4e7df" stroke-width="1">
    <line x1="120" y1="70" x2="120" y2="250"/><line x1="170" y1="70" x2="170" y2="250"/>
    <line x1="220" y1="70" x2="220" y2="250"/><line x1="270" y1="70" x2="270" y2="250"/>
    <line x1="320" y1="70" x2="320" y2="250"/><line x1="370" y1="70" x2="370" y2="250"/>
    <line x1="420" y1="70" x2="420" y2="250"/><line x1="470" y1="70" x2="470" y2="250"/>
    <line x1="70" y1="100" x2="530" y2="100"/><line x1="70" y1="130" x2="530" y2="130"/>
    <line x1="70" y1="190" x2="530" y2="190"/><line x1="70" y1="220" x2="530" y2="220"/>
  </g>
  <line x1="70" y1="160" x2="540" y2="160" stroke="#191d24" stroke-width="1.6"/>
  <line x1="70" y1="250" x2="70" y2="66" stroke="#191d24" stroke-width="1.6"/>
  <text x="548" y="164" font-size="13" fill="#191d24">x</text>
  <text x="60" y="60" font-size="13" fill="#191d24" text-anchor="middle">y</text>
  <g font-size="11" fill="#7b838d" text-anchor="middle">
    <text x="120" y="176">1</text><text x="220" y="176">3</text><text x="320" y="176">5</text><text x="420" y="176">8</text><text x="470" y="176">10</text>
  </g>
  <g font-size="11" fill="#7b838d" text-anchor="end">
    <text x="62" y="134">1</text><text x="62" y="104">2</text><text x="62" y="224">−1</text>
  </g>

  <path d="M74 250 C90 210, 104 178, 120 160 C170 132, 240 118, 320 110 C380 105, 430 102, 470 100"
        fill="none" stroke="#3a45a0" stroke-width="2.8"/>
  <circle cx="120" cy="160" r="5.5" fill="#0f7864"/>
  <text x="128" y="152" font-size="11.5" fill="#0f7864">log₁₀1 = 0</text>
  <circle cx="470" cy="100" r="6" fill="#3a45a0"/>
  <rect x="400" y="70" width="118" height="24" rx="3" fill="#3a45a0"/>
  <text x="459" y="87" font-size="12" fill="#ffffff" text-anchor="middle">log₁₀10 = 1</text>

  <rect x="570" y="80" width="198" height="150" rx="4" fill="#ffffff" stroke="#d6dad1"/>
  <text x="590" y="108" font-size="13.5" fill="#191d24">지수함수와 정반대</text>
  <text x="590" y="138" font-size="12.5" fill="#a2661c">2ˣ : 처음 느리다 폭발</text>
  <text x="590" y="162" font-size="12.5" fill="#3a45a0">log x : 처음 빠르다 완만</text>
  <text x="590" y="196" font-size="12.5" fill="#4d5561">x가 10배가 되어야</text>
  <text x="590" y="216" font-size="12.5" fill="#4d5561">y가 겨우 1 오릅니다.</text>

  <text x="30" y="282" font-size="13" fill="#7b838d">그래서 로그는 <tspan fill="#3a45a0">아주 큰 수를 작게 압축</tspan>하는 데 쓰입니다. 1,000,000이 6이 되니까요.</text>
</svg>
