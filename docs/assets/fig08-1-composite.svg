<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="1" y="1" width="798" height="238" rx="8" fill="#f7f8f5" stroke="#d6dad1"/>
  <text x="30" y="36" font-size="15" fill="#7b838d">한 상자의 출력을 다음 상자의 입력으로 — 그게 전부입니다</text>

  <text x="62" y="128" font-size="26" fill="#3a45a0" text-anchor="middle">3</text>
  <path d="M86 120 H136" stroke="#191d24" stroke-width="1.8"/><path d="M130 115 L138 120 L130 125 z" fill="#191d24"/>

  <rect x="146" y="86" width="180" height="70" rx="5" fill="#e5e7f4" stroke="#3a45a0" stroke-width="1.8"/>
  <text x="236" y="118" font-size="15" fill="#191d24" text-anchor="middle">f: 2배 하기</text>
  <text x="236" y="140" font-size="12.5" fill="#3a45a0" text-anchor="middle">f(x) = 2x</text>

  <path d="M334 120 H392" stroke="#191d24" stroke-width="1.8"/><path d="M386 115 L394 120 L386 125 z" fill="#191d24"/>
  <text x="363" y="106" font-size="17" fill="#0f7864" text-anchor="middle">6</text>

  <rect x="402" y="86" width="180" height="70" rx="5" fill="#e5e7f4" stroke="#3a45a0" stroke-width="1.8"/>
  <text x="492" y="118" font-size="15" fill="#191d24" text-anchor="middle">g: 1 더하기</text>
  <text x="492" y="140" font-size="12.5" fill="#3a45a0" text-anchor="middle">g(x) = x + 1</text>

  <path d="M590 120 H640" stroke="#191d24" stroke-width="1.8"/><path d="M634 115 L642 120 L634 125 z" fill="#191d24"/>
  <text x="672" y="128" font-size="26" fill="#0f7864" text-anchor="middle">7</text>

  <text x="30" y="196" font-size="14" fill="#191d24">이걸 한 줄로 적으면 &#160;<tspan font-family="'SF Mono',Menlo,Consolas,monospace" fill="#3a45a0">g(f(3)) = 7</tspan> &#160;— 안쪽부터 읽습니다.</text>
  <text x="30" y="222" font-size="13" fill="#7b838d">코드로는 &#160;g(f(3)) &#160;— 파이썬과 똑같이 안쪽 괄호부터 계산합니다.</text>
</svg>
