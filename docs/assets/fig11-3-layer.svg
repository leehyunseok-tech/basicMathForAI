<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="1" y="1" width="798" height="318" rx="8" fill="#f7f8f5" stroke="#d6dad1"/>
  <text x="30" y="36" font-size="15" fill="#7b838d">Wx + b 를 그림으로 — 뉴런 하나하나가 “가로줄 하나”입니다</text>

  <g font-size="13" fill="#3a45a0" text-anchor="end">
    <text x="112" y="106">x₁</text><text x="112" y="150">x₂</text><text x="112" y="194">x₃</text>
  </g>
  <g fill="#3a45a0">
    <circle cx="128" cy="101" r="8"/><circle cx="128" cy="145" r="8"/><circle cx="128" cy="189" r="8"/>
  </g>
  <g stroke="#d6dad1" stroke-width="1.2" fill="none">
    <path d="M136 101 L292 123"/><path d="M136 145 L292 123"/><path d="M136 189 L292 123"/>
    <path d="M136 101 L292 167"/><path d="M136 145 L292 167"/><path d="M136 189 L292 167"/>
  </g>
  <g fill="#0f7864">
    <circle cx="300" cy="123" r="10"/><circle cx="300" cy="167" r="10"/>
  </g>
  <text x="322" y="118" font-size="12.5" fill="#0f7864">뉴런 1 → W의 1번째 가로줄 · b₁</text>
  <text x="322" y="172" font-size="12.5" fill="#0f7864">뉴런 2 → W의 2번째 가로줄 · b₂</text>

  <text x="128" y="228" font-size="12" fill="#7b838d" text-anchor="middle">입력 3개</text>
  <text x="300" y="206" font-size="12" fill="#7b838d" text-anchor="middle">출력 2개</text>

  <rect x="46" y="248" width="722" height="56" rx="4" fill="#e5e7f4" stroke="#3a45a0"/>
  <text x="70" y="274" font-size="14" fill="#191d24">선 하나하나가 <tspan fill="#3a45a0">가중치 w</tspan> 하나입니다. 여기서는 3×2 = 6개.</text>
  <text x="70" y="296" font-size="13" fill="#7b838d">784개 → 128개 층이면 선이 100,352개. 그걸 표 하나로 묶은 게 대문자 W 입니다.</text>

  <rect x="560" y="76" width="208" height="150" rx="4" fill="#ffffff" stroke="#d6dad1"/>
  <text x="580" y="104" font-size="13.5" fill="#191d24">Chapter 05를 기억하세요</text>
  <text x="580" y="132" font-size="13" fill="#4d5561">뉴런 하나 = wx + b</text>
  <text x="580" y="156" font-size="13" fill="#4d5561">뉴런 여럿 = Wx + b</text>
  <text x="580" y="190" font-size="12.5" fill="#3a45a0">소문자가 대문자가 된 것</text>
  <text x="580" y="210" font-size="12.5" fill="#3a45a0">그게 전부입니다.</text>
</svg>
