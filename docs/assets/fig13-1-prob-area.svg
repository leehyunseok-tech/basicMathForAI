<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="1" y="1" width="798" height="258" rx="8" fill="#f7f8f5" stroke="#d6dad1"/>
  <text x="30" y="36" font-size="15" fill="#7b838d">확률 = 전체 중 차지하는 넓이. 그래서 항상 0과 1 사이입니다.</text>

  <rect x="40" y="66" width="300" height="140" fill="#ffffff" stroke="#191d24" stroke-width="1.6"/>
  <rect x="40" y="66" width="100" height="140" fill="#e5e7f4"/>
  <line x1="140" y1="66" x2="140" y2="206" stroke="#3a45a0" stroke-width="1.6"/>
  <text x="90" y="142" font-size="15" fill="#3a45a0" text-anchor="middle">당첨</text>
  <text x="240" y="142" font-size="15" fill="#7b838d" text-anchor="middle">꽝</text>
  <text x="190" y="228" font-size="12.5" fill="#7b838d" text-anchor="middle">전체 = 1 (100%)</text>

  <rect x="380" y="66" width="388" height="140" rx="4" fill="#ffffff" stroke="#d6dad1"/>
  <text x="400" y="94" font-size="14" fill="#191d24">확률 = <tspan fill="#3a45a0">원하는 경우의 수</tspan> ÷ <tspan fill="#7b838d">전체 경우의 수</tspan></text>
  <text x="400" y="128" font-size="13.5" fill="#4d5561">상자에 공 10개, 그중 당첨 공 3개</text>
  <text x="400" y="156" font-size="16" fill="#191d24">P(당첨) = 3 / 10 = 0.3 = 30%</text>
  <text x="400" y="188" font-size="12.5" fill="#7b838d">P는 Probability의 P. “피 당첨”이라고 읽습니다.</text>

  <g font-size="13">
    <rect x="40" y="222" width="728" height="26" rx="3" fill="#e5e7f4" stroke="#3a45a0"/>
    <text x="58" y="240" fill="#191d24">P = 0 은 “절대 안 일어남”, P = 1 은 “반드시 일어남”. 그 사이 값은 전부 “아마도”입니다.</text>
  </g>
</svg>
