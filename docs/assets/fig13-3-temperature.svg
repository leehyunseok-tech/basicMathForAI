<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="1" y="1" width="798" height="298" rx="8" fill="#f7f8f5" stroke="#d6dad1"/>
  <text x="30" y="36" font-size="15" fill="#7b838d">AI는 “정답”이 아니라 확률을 내놓고, 그중 하나를 뽑습니다</text>
  <text x="30" y="60" font-size="13.5" fill="#191d24">“오늘 날씨가 참 ___” 다음에 올 단어의 확률</text>

  <g>
    <rect x="30" y="78" width="240" height="180" rx="4" fill="#ffffff" stroke="#d6dad1"/>
    <text x="150" y="104" font-size="13" fill="#3a45a0" text-anchor="middle">T = 0.2 (낮음)</text>
    <rect x="50" y="118" width="180" height="18" fill="#3a45a0"/><text x="56" y="132" font-size="11" fill="#ffffff">좋다 95%</text>
    <rect x="50" y="144" width="10" height="18" fill="#7b838d"/><text x="68" y="158" font-size="11" fill="#7b838d">맑다 3%</text>
    <rect x="50" y="170" width="5" height="18" fill="#d6dad1"/><text x="68" y="184" font-size="11" fill="#7b838d">덥다 2%</text>
    <text x="150" y="222" font-size="12.5" fill="#191d24" text-anchor="middle">거의 항상 같은 답</text>
    <text x="150" y="244" font-size="12" fill="#7b838d" text-anchor="middle">안정적 · 지루함</text>
  </g>

  <g>
    <rect x="286" y="78" width="240" height="180" rx="4" fill="#e5e7f4" stroke="#3a45a0"/>
    <text x="406" y="104" font-size="13" fill="#3a45a0" text-anchor="middle">T = 1.0 (기본)</text>
    <rect x="306" y="118" width="120" height="18" fill="#3a45a0"/><text x="312" y="132" font-size="11" fill="#ffffff">좋다 60%</text>
    <rect x="306" y="144" width="50" height="18" fill="#7b838d"/><text x="364" y="158" font-size="11" fill="#7b838d">맑다 25%</text>
    <rect x="306" y="170" width="30" height="18" fill="#d6dad1"/><text x="344" y="184" font-size="11" fill="#7b838d">덥다 15%</text>
    <text x="406" y="222" font-size="12.5" fill="#191d24" text-anchor="middle">보통은 “좋다”</text>
    <text x="406" y="244" font-size="12" fill="#7b838d" text-anchor="middle">가끔 다른 말도</text>
  </g>

  <g>
    <rect x="542" y="78" width="226" height="180" rx="4" fill="#ffffff" stroke="#d6dad1"/>
    <text x="655" y="104" font-size="13" fill="#a2661c" text-anchor="middle">T = 1.8 (높음)</text>
    <rect x="562" y="118" width="70" height="18" fill="#3a45a0"/><text x="640" y="132" font-size="11" fill="#7b838d">좋다 38%</text>
    <rect x="562" y="144" width="60" height="18" fill="#7b838d"/><text x="630" y="158" font-size="11" fill="#7b838d">맑다 33%</text>
    <rect x="562" y="170" width="52" height="18" fill="#d6dad1"/><text x="622" y="184" font-size="11" fill="#7b838d">덥다 29%</text>
    <text x="655" y="222" font-size="12.5" fill="#191d24" text-anchor="middle">매번 다른 답</text>
    <text x="655" y="244" font-size="12" fill="#a2661c" text-anchor="middle">창의적 · 헛소리 위험</text>
  </g>

  <rect x="30" y="266" width="738" height="26" rx="3" fill="#dfeee9" stroke="#0f7864"/>
  <text x="48" y="284" font-size="13" fill="#191d24">temperature는 확률 분포를 <tspan fill="#0f7864">평평하게(높이면) / 뾰족하게(낮추면)</tspan> 만드는 손잡이입니다.</text>
</svg>
