<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" width="800" height="290" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="1" y="1" width="798" height="288" rx="8" fill="#f7f8f5" stroke="#d6dad1"/>
  <text x="30" y="36" font-size="15" fill="#7b838d">정보가 하나 늘면, “전체”가 줄어들면서 확률이 바뀝니다</text>

  <g>
    <text x="180" y="66" font-size="13" fill="#191d24" text-anchor="middle">아무 정보 없을 때</text>
    <rect x="60" y="80" width="240" height="150" fill="#ffffff" stroke="#191d24" stroke-width="1.5"/>
    <rect x="60" y="80" width="120" height="75" fill="#e5e7f4"/>
    <line x1="180" y1="80" x2="180" y2="230" stroke="#d6dad1"/>
    <line x1="60" y1="155" x2="300" y2="155" stroke="#d6dad1"/>
    <text x="120" y="122" font-size="12" fill="#3a45a0" text-anchor="middle">비 · 우산</text>
    <text x="240" y="122" font-size="12" fill="#7b838d" text-anchor="middle">비 · 우산X</text>
    <text x="120" y="198" font-size="12" fill="#7b838d" text-anchor="middle">맑음 · 우산</text>
    <text x="240" y="198" font-size="12" fill="#7b838d" text-anchor="middle">맑음 · 우산X</text>
    <text x="180" y="254" font-size="12.5" fill="#7b838d" text-anchor="middle">전체 = 100명</text>
  </g>

  <path d="M320 155 H366" stroke="#3a45a0" stroke-width="1.8"/><path d="M361 150 L368 155 L361 160 z" fill="#3a45a0"/>
  <text x="343" y="142" font-size="11.5" fill="#3a45a0" text-anchor="middle">“비 온다”</text>
  <text x="343" y="176" font-size="11.5" fill="#3a45a0" text-anchor="middle">를 알았다</text>

  <g>
    <text x="500" y="66" font-size="13" fill="#3a45a0" text-anchor="middle">“비 온다”를 알았을 때</text>
    <rect x="380" y="80" width="240" height="75" fill="#ffffff" stroke="#3a45a0" stroke-width="1.8"/>
    <rect x="380" y="80" width="120" height="75" fill="#e5e7f4"/>
    <line x1="500" y1="80" x2="500" y2="155" stroke="#3a45a0"/>
    <text x="440" y="122" font-size="12" fill="#3a45a0" text-anchor="middle">우산 O</text>
    <text x="560" y="122" font-size="12" fill="#7b838d" text-anchor="middle">우산 X</text>
    <rect x="380" y="155" width="240" height="75" fill="#f7f8f5" stroke="#e4e7df" stroke-dasharray="4 3"/>
    <text x="500" y="198" font-size="12" fill="#d6dad1" text-anchor="middle">이 부분은 이제 관심 밖</text>
    <text x="500" y="254" font-size="12.5" fill="#3a45a0" text-anchor="middle">전체가 “비 오는 날”로 줄었습니다</text>
  </g>

  <rect x="650" y="80" width="118" height="150" rx="4" fill="#e5e7f4" stroke="#3a45a0"/>
  <text x="709" y="112" font-size="13" fill="#3a45a0" text-anchor="middle">P(우산|비)</text>
  <text x="709" y="146" font-size="12" fill="#4d5561" text-anchor="middle">“비 온다는</text>
  <text x="709" y="166" font-size="12" fill="#4d5561" text-anchor="middle">조건에서</text>
  <text x="709" y="186" font-size="12" fill="#4d5561" text-anchor="middle">우산 쓸 확률”</text>
  <text x="709" y="214" font-size="12" fill="#7b838d" text-anchor="middle">| 는 “~일 때”</text>

  <text x="30" y="278" font-size="13" fill="#7b838d">세로줄 <tspan fill="#3a45a0">|</tspan> 는 “조건”을 뜻합니다. 나눗셈이나 절댓값이 아닙니다.</text>
</svg>
