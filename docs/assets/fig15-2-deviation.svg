<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="1" y="1" width="798" height="338" rx="8" fill="#f7f8f5" stroke="#d6dad1"/>
  <text x="30" y="34" font-size="15" fill="#7b838d">같은 5명의 국어·영어 점수 — 평균은 둘 다 50점입니다</text>

  <rect x="30" y="52" width="52" height="86" rx="5" fill="#3a45a0"/>
  <text x="56" y="88" font-size="15" fill="#ffffff" text-anchor="middle">국</text>
  <text x="56" y="112" font-size="15" fill="#ffffff" text-anchor="middle">어</text>
  <line x1="110" y1="118" x2="750" y2="118" stroke="#3a45a0" stroke-width="1.6"/>
  <g stroke="#3a45a0" stroke-width="1.3">
    <line x1="110" y1="112" x2="110" y2="126"/><line x1="270" y1="112" x2="270" y2="126"/>
    <line x1="430" y1="112" x2="430" y2="126"/><line x1="590" y1="112" x2="590" y2="126"/>
    <line x1="750" y1="112" x2="750" y2="126"/>
  </g>
  <g>
    <circle cx="334" cy="92" r="17" fill="#3a45a0"/><text x="334" y="98" font-size="13" fill="#fff" text-anchor="middle">35</text>
    <circle cx="398" cy="92" r="17" fill="#3a45a0"/><text x="398" y="98" font-size="13" fill="#fff" text-anchor="middle">45</text>
    <circle cx="430" cy="92" r="17" fill="#3a45a0"/><text x="430" y="98" font-size="13" fill="#fff" text-anchor="middle">50</text>
    <circle cx="462" cy="92" r="17" fill="#3a45a0"/><text x="462" y="98" font-size="13" fill="#fff" text-anchor="middle">55</text>
    <circle cx="526" cy="92" r="17" fill="#3a45a0"/><text x="526" y="98" font-size="13" fill="#fff" text-anchor="middle">65</text>
  </g>
  <path d="M430 132 L424 142 L436 142 z" fill="#a2661c"/>
  <text x="430" y="158" font-size="12" fill="#a2661c" text-anchor="middle">평균 50점</text>
  <text x="110" y="142" font-size="11.5" fill="#7b838d" text-anchor="middle">0점</text>
  <text x="750" y="142" font-size="11.5" fill="#7b838d" text-anchor="middle">100점</text>
  <rect x="320" y="66" width="220" height="12" rx="6" fill="#e5e7f4" stroke="#3a45a0" stroke-width="0.8"/>
  <text x="430" y="62" font-size="11.5" fill="#3a45a0" text-anchor="middle">편차가 작다 — 다들 비슷</text>

  <rect x="30" y="192" width="52" height="86" rx="5" fill="#a2661c"/>
  <text x="56" y="228" font-size="15" fill="#ffffff" text-anchor="middle">영</text>
  <text x="56" y="252" font-size="15" fill="#ffffff" text-anchor="middle">어</text>
  <line x1="110" y1="258" x2="750" y2="258" stroke="#a2661c" stroke-width="1.6"/>
  <g stroke="#a2661c" stroke-width="1.3">
    <line x1="110" y1="252" x2="110" y2="264"/><line x1="270" y1="252" x2="270" y2="264"/>
    <line x1="430" y1="252" x2="430" y2="264"/><line x1="590" y1="252" x2="590" y2="264"/>
    <line x1="750" y1="252" x2="750" y2="264"/>
  </g>
  <g>
    <circle cx="142" cy="232" r="17" fill="#a2661c"/><text x="142" y="238" font-size="13" fill="#fff" text-anchor="middle">5</text>
    <circle cx="334" cy="232" r="17" fill="#a2661c"/><text x="334" y="238" font-size="13" fill="#fff" text-anchor="middle">35</text>
    <circle cx="430" cy="232" r="17" fill="#a2661c"/><text x="430" y="238" font-size="13" fill="#fff" text-anchor="middle">50</text>
    <circle cx="526" cy="232" r="17" fill="#a2661c"/><text x="526" y="238" font-size="13" fill="#fff" text-anchor="middle">65</text>
    <circle cx="718" cy="232" r="17" fill="#a2661c"/><text x="718" y="238" font-size="13" fill="#fff" text-anchor="middle">95</text>
  </g>
  <path d="M430 272 L424 282 L436 282 z" fill="#a2661c"/>
  <text x="430" y="298" font-size="12" fill="#a2661c" text-anchor="middle">평균 50점</text>
  <text x="110" y="282" font-size="11.5" fill="#7b838d" text-anchor="middle">0점</text>
  <text x="750" y="282" font-size="11.5" fill="#7b838d" text-anchor="middle">100점</text>
  <rect x="128" y="206" width="604" height="12" rx="6" fill="#f3e9d9" stroke="#a2661c" stroke-width="0.8"/>
  <text x="430" y="202" font-size="11.5" fill="#a2661c" text-anchor="middle">편차가 크다 — 극과 극</text>

  <rect x="30" y="308" width="738" height="24" rx="3" fill="#ffffff" stroke="#d6dad1"/>
  <text x="50" y="325" font-size="12.5" fill="#191d24">평균만 보면 “두 시험의 난이도가 비슷하다”는 것밖에 알 수 없습니다. <tspan fill="#3a45a0">흩어진 정도를 재는 숫자가 따로 필요합니다.</tspan></text>
</svg>
