<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="1" y="1" width="798" height="338" rx="8" fill="#f7f8f5" stroke="#d6dad1"/>
  <text x="30" y="34" font-size="15" fill="#7b838d">가장 자연스러운 첫 시도 — 평균에서 떨어진 거리를 그냥 평균 내기 (평균편차)</text>
  <text x="30" y="58" font-size="13" fill="#191d24">영어 점수 5, 35, 50, 65, 95 · 평균 50점</text>

  <g>
    <line x1="180" y1="90" x2="700" y2="90" stroke="#d6dad1" stroke-width="1.2"/>
    <line x1="440" y1="82" x2="440" y2="98" stroke="#a2661c" stroke-width="1.4"/>
    <circle cx="180" cy="90" r="14" fill="#a2661c"/><text x="180" y="95" font-size="12" fill="#fff" text-anchor="middle">5</text>
    <path d="M436 84 H190" stroke="#0f7864" stroke-width="2"/><path d="M196 79 L184 84 L196 89 z" fill="#0f7864"/>
    <rect x="264" y="66" width="94" height="20" rx="3" fill="#0f7864"/><text x="311" y="81" font-size="12" fill="#fff" text-anchor="middle">45점 차이</text>
    <text x="452" y="95" font-size="11.5" fill="#a2661c">평균</text>

    <line x1="180" y1="130" x2="700" y2="130" stroke="#d6dad1" stroke-width="1.2"/>
    <line x1="440" y1="122" x2="440" y2="138" stroke="#a2661c" stroke-width="1.4"/>
    <circle cx="336" cy="130" r="14" fill="#a2661c"/><text x="336" y="135" font-size="12" fill="#fff" text-anchor="middle">35</text>
    <path d="M436 124 H346" stroke="#0f7864" stroke-width="2"/><path d="M352 119 L340 124 L352 129 z" fill="#0f7864"/>
    <rect x="352" y="106" width="80" height="20" rx="3" fill="#0f7864"/><text x="392" y="121" font-size="12" fill="#fff" text-anchor="middle">15점 차이</text>

    <line x1="180" y1="170" x2="700" y2="170" stroke="#d6dad1" stroke-width="1.2"/>
    <line x1="440" y1="162" x2="440" y2="178" stroke="#a2661c" stroke-width="1.4" stroke-dasharray="3 2"/>
    <circle cx="440" cy="170" r="14" fill="#a2661c"/><text x="440" y="175" font-size="12" fill="#fff" text-anchor="middle">50</text>
    <text x="462" y="166" font-size="12" fill="#191d24">0점 차이</text>

    <line x1="180" y1="210" x2="700" y2="210" stroke="#d6dad1" stroke-width="1.2"/>
    <line x1="440" y1="202" x2="440" y2="218" stroke="#a2661c" stroke-width="1.4"/>
    <circle cx="544" cy="210" r="14" fill="#a2661c"/><text x="544" y="215" font-size="12" fill="#fff" text-anchor="middle">65</text>
    <path d="M444 204 H534" stroke="#3a45a0" stroke-width="2"/><path d="M528 199 L540 204 L528 209 z" fill="#3a45a0"/>
    <rect x="448" y="186" width="80" height="20" rx="3" fill="#3a45a0"/><text x="488" y="201" font-size="12" fill="#fff" text-anchor="middle">15점 차이</text>

    <line x1="180" y1="250" x2="700" y2="250" stroke="#d6dad1" stroke-width="1.2"/>
    <line x1="440" y1="242" x2="440" y2="258" stroke="#a2661c" stroke-width="1.4"/>
    <circle cx="700" cy="250" r="14" fill="#a2661c"/><text x="700" y="255" font-size="12" fill="#fff" text-anchor="middle">95</text>
    <path d="M444 244 H690" stroke="#3a45a0" stroke-width="2"/><path d="M684 239 L696 244 L684 249 z" fill="#3a45a0"/>
    <rect x="524" y="226" width="94" height="20" rx="3" fill="#3a45a0"/><text x="571" y="241" font-size="12" fill="#fff" text-anchor="middle">45점 차이</text>
  </g>

  <rect x="30" y="278" width="440" height="52" rx="4" fill="#e5e7f4" stroke="#3a45a0"/>
  <text x="250" y="300" font-size="14" fill="#191d24" text-anchor="middle">(45 + 15 + 0 + 15 + 45) ÷ 5</text>
  <text x="250" y="322" font-size="15" fill="#3a45a0" text-anchor="middle" font-weight="bold">= 평균편차 24점</text>

  <rect x="490" y="278" width="278" height="52" rx="4" fill="#ffffff" stroke="#d6dad1"/>
  <text x="629" y="300" font-size="12.5" fill="#191d24" text-anchor="middle">“평균에서 평균적으로 24점쯤</text>
  <text x="629" y="320" font-size="12.5" fill="#191d24" text-anchor="middle">떨어져 있다” — 아주 직관적입니다</text>
</svg>
