  <rect x="30" y="278" width="360" height="52" rx="4" fill="#e5e7f4" stroke="#3a45a0"/>
  <text x="210" y="300" font-size="13" fill="#3a45a0" text-anchor="middle">평균과의 차이 ≈ 표준편차 1배</text>
  <text x="210" y="320" font-size="12.5" fill="#191d24" text-anchor="middle">→ 흔히 있는 값 (일반적)</text>

  <rect x="410" y="278" width="358" height="52" rx="4" fill="#f3e9d9" stroke="#a2661c"/>
  <text x="589" y="300" font-size="13" fill="#a2661c" text-anchor="middle">평균과의 차이 ≥ 표준편차 2배</text>
  <text x="589" y="320" font-size="12.5" fill="#191d24" text-anchor="middle">→ 상당히 특수한 값 (대략 상하위 5%)</text>
