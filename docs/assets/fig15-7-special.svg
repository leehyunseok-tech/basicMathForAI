<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="1" y="1" width="798" height="338" rx="8" fill="#f7f8f5" stroke="#d6dad1"/>
  <text x="30" y="34" font-size="15" fill="#7b838d">표준편차로 “이 데이터가 특수한가”를 판단할 수 있습니다</text>

  <line x1="100" y1="200" x2="700" y2="200" stroke="#191d24" stroke-width="1.5"/>
  <rect x="100" y="88" width="128" height="112" fill="#f3e9d9"/>
  <rect x="572" y="88" width="128" height="112" fill="#f3e9d9"/>
  <rect x="120" y="104" width="76" height="24" rx="4" fill="#a2661c"/><text x="158" y="121" font-size="12.5" fill="#fff" text-anchor="middle">특수</text>
  <rect x="604" y="104" width="76" height="24" rx="4" fill="#a2661c"/><text x="642" y="121" font-size="12.5" fill="#fff" text-anchor="middle">특수</text>

  <g fill="#b9bdb5">
    <rect x="164" y="192" width="32" height="8"/><rect x="196" y="186" width="32" height="14"/>
    <rect x="228" y="170" width="32" height="30"/><rect x="260" y="148" width="32" height="52"/>
    <rect x="292" y="126" width="32" height="74"/><rect x="324" y="108" width="32" height="92"/>
    <rect x="356" y="96" width="32" height="104"/><rect x="388" y="96" width="32" height="104"/>
    <rect x="420" y="108" width="32" height="92"/><rect x="452" y="126" width="32" height="74"/>
    <rect x="484" y="148" width="32" height="52"/><rect x="516" y="170" width="32" height="30"/>
    <rect x="548" y="186" width="32" height="14"/><rect x="580" y="192" width="32" height="8"/>
  </g>
  <g fill="#e0a463">
    <rect x="164" y="192" width="32" height="8"/><rect x="196" y="186" width="32" height="14"/>
    <rect x="580" y="192" width="32" height="8"/><rect x="548" y="186" width="32" height="14"/>
  </g>

  <circle cx="388" cy="200" r="5" fill="#191d24"/>
  <text x="388" y="222" font-size="12.5" fill="#191d24" text-anchor="middle">평균</text>
  <line x1="388" y1="200" x2="388" y2="82" stroke="#191d24" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="484" y1="200" x2="484" y2="88" stroke="#3a45a0" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="292" y1="200" x2="292" y2="88" stroke="#3a45a0" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="572" y1="200" x2="572" y2="76" stroke="#a2661c" stroke-width="1.4"/>
  <line x1="228" y1="200" x2="228" y2="76" stroke="#a2661c" stroke-width="1.4"/>

  <text x="436" y="240" font-size="11.5" fill="#3a45a0" text-anchor="middle">1σ</text>
  <text x="340" y="240" font-size="11.5" fill="#3a45a0" text-anchor="middle">1σ</text>
  <text x="528" y="262" font-size="11.5" fill="#a2661c" text-anchor="middle">2σ 바깥</text>
  <text x="252" y="262" font-size="11.5" fill="#a2661c" text-anchor="middle">2σ 바깥</text>
  <text x="80" y="150" font-size="12" fill="#7b838d" text-anchor="end">데이터</text>
