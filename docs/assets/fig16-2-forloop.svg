<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="1" y="1" width="798" height="258" rx="8" fill="#f7f8f5" stroke="#d6dad1"/>
  <text x="30" y="36" font-size="15" fill="#7b838d">Σ 는 for 루프입니다 — 나란히 놓고 보면 부품이 하나씩 대응됩니다</text>

  <rect x="30" y="58" width="350" height="150" rx="4" fill="#e5e7f4" stroke="#3a45a0"/>
  <text x="205" y="86" font-size="13" fill="#3a45a0" text-anchor="middle">수학</text>
  <text x="150" y="150" font-size="44" fill="#3a45a0" text-anchor="middle">Σ</text>
  <text x="150" y="106" font-size="15" fill="#a2661c" text-anchor="middle">n</text>
  <text x="150" y="180" font-size="15" fill="#0f7864" text-anchor="middle">i=1</text>
  <text x="215" y="152" font-size="20" fill="#191d24">xᵢ</text>

  <text x="400" y="140" font-size="20" fill="#7b838d" text-anchor="middle">≡</text>

  <rect x="420" y="58" width="348" height="150" rx="4" fill="#191d24"/>
  <text x="594" y="86" font-size="13" fill="#ffffff" text-anchor="middle">파이썬</text>
  <g font-family="'SF Mono',Menlo,Consolas,monospace" font-size="14">
    <text x="446" y="120" fill="#e6e9e2">total = 0</text>
    <text x="446" y="146" fill="#e6e9e2">for <tspan fill="#dfa863">i</tspan> in range(<tspan fill="#5fc4ab">1</tspan>, <tspan fill="#dfa863">n+1</tspan>):</text>
    <text x="446" y="172" fill="#e6e9e2">    total += <tspan fill="#98a2ef">x[i]</tspan></text>
  </g>

  <rect x="30" y="222" width="738" height="28" rx="3" fill="#ffffff" stroke="#d6dad1"/>
  <text x="50" y="241" font-size="13" fill="#191d24">시작값(i=1) · 끝값(n) · 반복할 것(xᵢ) · 누적(+=) — <tspan fill="#3a45a0">완전히 같은 네 부품</tspan>입니다.</text>
</svg>
