<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="1" y="1" width="798" height="298" rx="8" fill="#f7f8f5" stroke="#d6dad1"/>
  <text x="30" y="36" font-size="15" fill="#7b838d">Chapter 06의 골짜기로 돌아갑니다 — 바닥에서는 기울기가 0입니다</text>

  <line x1="80" y1="250" x2="560" y2="250" stroke="#191d24" stroke-width="1.6"/>
  <line x1="80" y1="250" x2="80" y2="70" stroke="#191d24" stroke-width="1.6"/>
  <text x="320" y="276" font-size="12.5" fill="#191d24" text-anchor="middle">가중치 w →</text>
  <text x="64" y="64" font-size="12.5" fill="#191d24" text-anchor="middle">손실 L</text>

  <path d="M120 90 Q320 350 520 90" fill="none" stroke="#3a45a0" stroke-width="2.8"/>

  <circle cx="170" cy="150" r="6" fill="#a2661c"/>
  <line x1="130" y1="184" x2="216" y2="118" stroke="#a2661c" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="120" y="112" font-size="12.5" fill="#a2661c">기울기 음수(−)</text>
  <text x="120" y="130" font-size="12" fill="#a2661c">→ 오른쪽이 내리막</text>

  <circle cx="320" cy="245" r="7" fill="#0f7864"/>
  <line x1="266" y1="245" x2="374" y2="245" stroke="#0f7864" stroke-width="2.4"/>
  <text x="320" y="226" font-size="13" fill="#0f7864" text-anchor="middle">기울기 = 0</text>
  <text x="320" y="208" font-size="12" fill="#0f7864" text-anchor="middle">바닥 도착!</text>

  <circle cx="470" cy="150" r="6" fill="#a2661c"/>
  <line x1="424" y1="118" x2="512" y2="184" stroke="#a2661c" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="430" y="112" font-size="12.5" fill="#a2661c">기울기 양수(+)</text>
  <text x="430" y="130" font-size="12" fill="#a2661c">→ 왼쪽이 내리막</text>

  <rect x="592" y="88" width="176" height="150" rx="4" fill="#e5e7f4" stroke="#3a45a0"/>
  <text x="680" y="118" font-size="13.5" fill="#3a45a0" text-anchor="middle">기울기 부호만 보면</text>
  <text x="680" y="152" font-size="12.5" fill="#191d24" text-anchor="middle">− 이면 → 오른쪽으로</text>
  <text x="680" y="178" font-size="12.5" fill="#191d24" text-anchor="middle">+ 이면 → 왼쪽으로</text>
  <text x="680" y="212" font-size="12.5" fill="#0f7864" text-anchor="middle">부호 반대로 가면</text>
  <text x="680" y="230" font-size="12.5" fill="#0f7864" text-anchor="middle">항상 내리막입니다</text>
</svg>
