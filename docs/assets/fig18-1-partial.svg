<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="1" y="1" width="798" height="278" rx="8" fill="#f7f8f5" stroke="#d6dad1"/>
  <text x="30" y="36" font-size="15" fill="#7b838d">손잡이가 여러 개일 때 — 나머지는 고정하고 하나씩만 돌려 봅니다</text>

  <rect x="30" y="58" width="350" height="180" rx="4" fill="#ffffff" stroke="#d6dad1"/>
  <text x="205" y="86" font-size="13" fill="#191d24" text-anchor="middle">오디오 믹서 · 손잡이 세 개</text>
  <g>
    <rect x="76" y="106" width="34" height="90" rx="4" fill="#f7f8f5" stroke="#d6dad1"/>
    <circle cx="93" cy="130" r="11" fill="#3a45a0"/>
    <text x="93" y="216" font-size="12" fill="#3a45a0" text-anchor="middle">w₁</text>
    <rect x="188" y="106" width="34" height="90" rx="4" fill="#f7f8f5" stroke="#d6dad1"/>
    <circle cx="205" cy="168" r="11" fill="#7b838d"/>
    <text x="205" y="216" font-size="12" fill="#7b838d" text-anchor="middle">w₂ 고정</text>
    <rect x="300" y="106" width="34" height="90" rx="4" fill="#f7f8f5" stroke="#d6dad1"/>
    <circle cx="317" cy="150" r="11" fill="#7b838d"/>
    <text x="317" y="216" font-size="12" fill="#7b838d" text-anchor="middle">w₃ 고정</text>
  </g>
  <path d="M93 100 V80" stroke="#3a45a0" stroke-width="1.6"/><path d="M88 85 L93 76 L98 85 z" fill="#3a45a0"/>
  <text x="93" y="70" font-size="11.5" fill="#3a45a0" text-anchor="middle">이것만 조금</text>

  <path d="M400 148 H440" stroke="#3a45a0" stroke-width="1.8"/><path d="M435 143 L442 148 L435 153 z" fill="#3a45a0"/>

  <rect x="456" y="58" width="312" height="180" rx="4" fill="#e5e7f4" stroke="#3a45a0"/>
  <text x="612" y="88" font-size="13.5" fill="#3a45a0" text-anchor="middle">“소리가 얼마나 변했나?”</text>
  <text x="612" y="128" font-size="24" fill="#191d24" text-anchor="middle">∂L / ∂w₁</text>
  <text x="612" y="164" font-size="12.5" fill="#4d5561" text-anchor="middle">“w₁만 조금 바꿨을 때</text>
  <text x="612" y="186" font-size="12.5" fill="#4d5561" text-anchor="middle">L이 얼마나 변하는가”</text>
  <text x="612" y="218" font-size="12.5" fill="#3a45a0" text-anchor="middle">이게 편미분입니다</text>

  <text x="30" y="266" font-size="13" fill="#7b838d">기호가 d 대신 ∂(라운드)로 바뀐 것뿐입니다. “여럿 중 하나만 봤다”는 표시입니다.</text>
</svg>
