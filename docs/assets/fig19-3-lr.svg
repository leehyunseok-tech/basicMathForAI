  <rect x="30" y="244" width="738" height="26" rx="3" fill="#ffffff" stroke="#d6dad1"/>
  <text x="50" y="262" font-size="13" fill="#191d24">손실이 <tspan fill="#a2661c">올라가거나 NaN</tspan>이 되면 → 학습률부터 낮춰 보세요. 가장 흔한 원인입니다.</text>
