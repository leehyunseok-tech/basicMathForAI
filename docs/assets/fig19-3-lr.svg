    <path d="M340 146 L364 184" stroke="#0f7864" stroke-width="1.4" stroke-dasharray="3 2"/>
    <path d="M372 192 L400 206" stroke="#0f7864" stroke-width="1.4" stroke-dasharray="3 2"/>
