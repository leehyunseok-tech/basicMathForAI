    <path d="M56 106 Q150 250 244 106" fill="none" stroke="#3a45a0" stroke-width="2.2"/>
    <g fill="#a2661c"><circle cx="76" cy="130" r="4"/><circle cx="86" cy="146" r="4"/><circle cx="96" cy="160" r="4"/><circle cx="106" cy="172" r="4"/></g>
    <text x="150" y="212" font-size="12" fill="#191d24" text-anchor="middle">거의 안 움직임 · 너무 느림</text>
  </g>
  <g>
    <rect x="286" y="56" width="240" height="176" rx="4" fill="#e5e7f4" stroke="#0f7864"/>
