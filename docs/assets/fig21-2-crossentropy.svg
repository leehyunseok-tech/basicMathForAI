<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="1" y="1" width="798" height="298" rx="8" fill="#f7f8f5" stroke="#d6dad1"/>
  <text x="30" y="36" font-size="15" fill="#7b838d">크로스엔트로피 손실 해부 — 부품이 세 개뿐입니다</text>

  <text x="400" y="96" font-size="30" fill="#191d24" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,monospace">L = − Σ y · log ŷ</text>

  <line x1="292" y1="110" x2="240" y2="150" stroke="#a2661c" stroke-width="1.3"/>
  <line x1="336" y1="110" x2="336" y2="150" stroke="#3a45a0" stroke-width="1.3"/>
  <line x1="392" y1="110" x2="430" y2="150" stroke="#0f7864" stroke-width="1.3"/>
  <line x1="480" y1="110" x2="590" y2="150" stroke="#a2661c" stroke-width="1.3"/>

  <rect x="30" y="158" width="176" height="110" rx="4" fill="#ffffff" stroke="#a2661c"/>
  <text x="118" y="184" font-size="17" fill="#a2661c" text-anchor="middle">−</text>
  <text x="118" y="210" font-size="12.5" fill="#191d24" text-anchor="middle">log는 항상 음수라서</text>
  <text x="118" y="230" font-size="12.5" fill="#191d24" text-anchor="middle">양수로 뒤집는 것</text>
  <text x="118" y="254" font-size="11.5" fill="#7b838d" text-anchor="middle">Ch 07</text>

  <rect x="222" y="158" width="176" height="110" rx="4" fill="#ffffff" stroke="#3a45a0"/>
  <text x="310" y="184" font-size="17" fill="#3a45a0" text-anchor="middle">Σ</text>
  <text x="310" y="210" font-size="12.5" fill="#191d24" text-anchor="middle">모든 후보에 대해</text>
  <text x="310" y="230" font-size="12.5" fill="#191d24" text-anchor="middle">전부 더하기 (for 루프)</text>
  <text x="310" y="254" font-size="11.5" fill="#7b838d" text-anchor="middle">Ch 16</text>

  <rect x="414" y="158" width="176" height="110" rx="4" fill="#ffffff" stroke="#0f7864"/>
  <text x="502" y="184" font-size="17" fill="#0f7864" text-anchor="middle">y</text>
  <text x="502" y="210" font-size="12.5" fill="#191d24" text-anchor="middle">정답만 1, 나머지 0</text>
  <text x="502" y="230" font-size="12.5" fill="#191d24" text-anchor="middle">→ 정답 항만 살아남음</text>
  <text x="502" y="254" font-size="11.5" fill="#7b838d" text-anchor="middle">원-핫</text>

  <rect x="606" y="158" width="164" height="110" rx="4" fill="#e5e7f4" stroke="#3a45a0"/>
  <text x="688" y="184" font-size="17" fill="#3a45a0" text-anchor="middle">log ŷ</text>
  <text x="688" y="210" font-size="12.5" fill="#191d24" text-anchor="middle">확신할수록 0에 가깝고</text>
  <text x="688" y="230" font-size="12.5" fill="#191d24" text-anchor="middle">틀릴수록 크게 음수</text>
  <text x="688" y="254" font-size="11.5" fill="#7b838d" text-anchor="middle">Ch 07</text>
</svg>
