  <text x="266" y="143" font-size="11" fill="#7b838d" text-anchor="middle">ReLU</text>

  <path d="M296 130 H396" stroke="#191d24" stroke-width="1.6"/><path d="M391 125 L398 130 L391 135 z" fill="#191d24"/>
  <text x="346" y="118" font-size="12" fill="#3a45a0" text-anchor="middle">w₂=0.3, b₂=0.2</text>

  <circle cx="426" cy="130" r="28" fill="#ffffff" stroke="#0f7864" stroke-width="1.8"/>
