  <path d="M456 130 H540" stroke="#191d24" stroke-width="1.6"/><path d="M535 125 L542 130 L535 135 z" fill="#191d24"/>
  <circle cx="570" cy="130" r="24" fill="#dfeee9" stroke="#0f7864" stroke-width="1.8"/>
