  <text x="110" y="180" font-size="12.5" fill="#7b838d" text-anchor="middle">입력 = 2</text>

  <path d="M136 130 H236" stroke="#191d24" stroke-width="1.6"/><path d="M231 125 L238 130 L231 135 z" fill="#191d24"/>
  <text x="186" y="118" font-size="12" fill="#3a45a0" text-anchor="middle">w₁=0.5, b₁=0</text>

