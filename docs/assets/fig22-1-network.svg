  <rect x="30" y="206" width="738" height="34" rx="4" fill="#e5e7f4" stroke="#3a45a0"/>
  <text x="50" y="228" font-size="13" fill="#191d24">파라미터 4개(w₁, b₁, w₂, b₂)만 있는 모델입니다. GPT는 이게 <tspan fill="#3a45a0">700억 개</tspan>일 뿐, 구조는 같습니다.</text>
