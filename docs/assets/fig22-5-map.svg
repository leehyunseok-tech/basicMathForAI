<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="1" y="1" width="798" height="338" rx="8" fill="#f7f8f5" stroke="#d6dad1"/>
  <text x="30" y="36" font-size="15" fill="#7b838d">배운 것 전체 지도 — 어느 개념이 AI의 어디에 쓰이는지</text>

  <g font-size="12.5">
    <rect x="30" y="56" width="738" height="28" fill="#191d24"/>
    <text x="52" y="75" fill="#ffffff" font-size="12">배운 수학</text>
    <text x="330" y="75" fill="#ffffff" font-size="12">AI에서의 자리</text>
    <text x="640" y="75" fill="#ffffff" font-size="12">장</text>

    <rect x="30" y="84" width="738" height="28" fill="#ffffff" stroke="#e4e7df"/>
    <text x="52" y="103" fill="#191d24">함수</text><text x="330" y="103" fill="#4d5561">모델 그 자체</text><text x="640" y="103" fill="#7b838d">4</text>

    <rect x="30" y="112" width="738" height="28" fill="#f7f8f5" stroke="#e4e7df"/>
    <text x="52" y="131" fill="#191d24">일차함수 기울기·절편</text><text x="330" y="131" fill="#4d5561">가중치 w · 편향 b</text><text x="640" y="131" fill="#7b838d">5</text>

    <rect x="30" y="140" width="738" height="28" fill="#ffffff" stroke="#e4e7df"/>
    <text x="52" y="159" fill="#191d24">이차함수 골짜기</text><text x="330" y="159" fill="#4d5561">손실 함수 (MSE)</text><text x="640" y="159" fill="#7b838d">6</text>

    <rect x="30" y="168" width="738" height="28" fill="#f7f8f5" stroke="#e4e7df"/>
    <text x="52" y="187" fill="#191d24">지수 · 로그</text><text x="330" y="187" fill="#4d5561">시그모이드 · 크로스엔트로피</text><text x="640" y="187" fill="#7b838d">7</text>

    <rect x="30" y="196" width="738" height="28" fill="#ffffff" stroke="#e4e7df"/>
    <text x="52" y="215" fill="#191d24">합성함수</text><text x="330" y="215" fill="#4d5561">층 쌓기 · 활성화 함수</text><text x="640" y="215" fill="#7b838d">8</text>

    <rect x="30" y="224" width="738" height="28" fill="#f7f8f5" stroke="#e4e7df"/>
    <text x="52" y="243" fill="#191d24">벡터 · 내적</text><text x="330" y="243" fill="#4d5561">임베딩 · 코사인 유사도 · 뉴런</text><text x="640" y="243" fill="#7b838d">9–10</text>

    <rect x="30" y="252" width="738" height="28" fill="#ffffff" stroke="#e4e7df"/>
    <text x="52" y="271" fill="#191d24">행렬 곱</text><text x="330" y="271" fill="#4d5561">Wx + b · shape 에러</text><text x="640" y="271" fill="#7b838d">11</text>

    <rect x="30" y="280" width="738" height="28" fill="#f7f8f5" stroke="#e4e7df"/>
    <text x="52" y="299" fill="#191d24">확률 · 통계</text><text x="330" y="299" fill="#4d5561">softmax 출력 · temperature · 표준화</text><text x="640" y="299" fill="#7b838d">13–15</text>

    <rect x="30" y="308" width="738" height="28" fill="#e5e7f4" stroke="#3a45a0"/>
    <text x="52" y="327" fill="#3a45a0">미분 · 연쇄법칙</text><text x="330" y="327" fill="#3a45a0">역전파 · 경사하강법</text><text x="640" y="327" fill="#3a45a0">17–19</text>
  </g>
</svg>
