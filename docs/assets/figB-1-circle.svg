<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="1" y="1" width="798" height="298" rx="8" fill="#f7f8f5" stroke="#d6dad1"/>
  <text x="30" y="36" font-size="15" fill="#7b838d">sin·cos은 삼각형이 아니라 “원 위를 도는 점의 그림자”로 이해하는 게 쉽습니다</text>

  <circle cx="190" cy="170" r="90" fill="none" stroke="#d6dad1" stroke-width="1.6"/>
  <line x1="80" y1="170" x2="300" y2="170" stroke="#191d24" stroke-width="1.3"/>
  <line x1="190" y1="270" x2="190" y2="70" stroke="#191d24" stroke-width="1.3"/>

  <line x1="190" y1="170" x2="254" y2="106" stroke="#3a45a0" stroke-width="2.4"/>
  <circle cx="254" cy="106" r="6" fill="#3a45a0"/>
  <path d="M215 170 A 25 25 0 0 0 208 152" fill="none" stroke="#a2661c" stroke-width="1.4"/>
  <text x="222" y="158" font-size="12" fill="#a2661c">θ</text>

  <line x1="254" y1="106" x2="254" y2="170" stroke="#0f7864" stroke-width="1.8" stroke-dasharray="4 3"/>
  <line x1="254" y1="106" x2="190" y2="106" stroke="#a2661c" stroke-width="1.8" stroke-dasharray="4 3"/>
  <line x1="190" y1="170" x2="254" y2="170" stroke="#0f7864" stroke-width="2.6"/>
  <line x1="190" y1="170" x2="190" y2="106" stroke="#a2661c" stroke-width="2.6"/>

  <text x="222" y="190" font-size="13" fill="#0f7864" text-anchor="middle">cos θ</text>
  <text x="168" y="142" font-size="13" fill="#a2661c" text-anchor="end">sin θ</text>
  <text x="190" y="288" font-size="12" fill="#7b838d" text-anchor="middle">반지름 1인 원(단위원)</text>

  <rect x="330" y="66" width="438" height="180" rx="4" fill="#ffffff" stroke="#d6dad1"/>
  <text x="352" y="94" font-size="13.5" fill="#191d24">점이 원을 한 바퀴 돌면</text>
  <line x1="352" y1="180" x2="744" y2="180" stroke="#191d24" stroke-width="1.2"/>
  <path d="M352 180 C382 130, 412 118, 450 118 C488 118, 518 130, 548 180 C578 230, 608 242, 646 242 C684 242, 714 230, 744 180"
        fill="none" stroke="#a2661c" stroke-width="2.2"/>
  <text x="450" y="112" font-size="12" fill="#a2661c">sin — 위아래로 출렁</text>
  <text x="560" y="210" font-size="12" fill="#0f7864">cos — 같은 모양, 시작점만 다름</text>
  <text x="352" y="232" font-size="12" fill="#7b838d">항상 −1 ~ 1 사이 · 계속 반복 (주기)</text>
</svg>
