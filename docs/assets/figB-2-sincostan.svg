<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="1" y="1" width="798" height="298" rx="8" fill="#f7f8f5" stroke="#d6dad1"/>
  <text x="30" y="34" font-size="15" fill="#7b838d">삼각비 세 개 정리 — “한 변을 1로 맞춘 직각삼각형”의 나머지 변 길이입니다</text>

  <g>
    <rect x="30" y="52" width="240" height="196" rx="4" fill="#ffffff" stroke="#c0442f" stroke-width="1.6"/>
    <rect x="30" y="52" width="70" height="26" fill="#c0442f"/>
    <text x="65" y="71" font-size="14" fill="#ffffff" text-anchor="middle">sin x</text>
    <path d="M60 190 L230 190 L230 120 z" fill="#e8927c" stroke="#c0442f" stroke-width="1.4"/>
    <line x1="230" y1="120" x2="230" y2="190" stroke="#c0442f" stroke-width="4"/>
    <path d="M64 186 A 26 26 0 0 0 78 178" fill="none" stroke="#191d24" stroke-width="1.2"/>
    <text x="86" y="184" font-size="12" fill="#191d24">x</text>
    <text x="140" y="142" font-size="13" fill="#191d24" text-anchor="middle">1</text>
    <path d="M62 186 L228 118" stroke="#191d24" stroke-width="1.2"/>
    <text x="150" y="216" font-size="12.5" fill="#c0442f" text-anchor="middle">빗변 1, 각도 x인</text>
    <text x="150" y="236" font-size="12.5" fill="#c0442f" text-anchor="middle">직각삼각형의 <tspan font-weight="bold">높이</tspan></text>
  </g>

  <g>
    <rect x="286" y="52" width="240" height="196" rx="4" fill="#ffffff" stroke="#2f7d4f" stroke-width="1.6"/>
    <rect x="286" y="52" width="76" height="26" fill="#2f7d4f"/>
    <text x="324" y="71" font-size="14" fill="#ffffff" text-anchor="middle">cos x</text>
    <path d="M316 190 L486 190 L486 120 z" fill="#8fc0a0" stroke="#2f7d4f" stroke-width="1.4"/>
    <line x1="316" y1="190" x2="486" y2="190" stroke="#2f7d4f" stroke-width="4"/>
    <path d="M320 186 A 26 26 0 0 0 334 178" fill="none" stroke="#191d24" stroke-width="1.2"/>
    <text x="342" y="184" font-size="12" fill="#191d24">x</text>
    <text x="396" y="142" font-size="13" fill="#191d24" text-anchor="middle">1</text>
    <path d="M318 186 L484 118" stroke="#191d24" stroke-width="1.2"/>
    <text x="406" y="216" font-size="12.5" fill="#2f7d4f" text-anchor="middle">빗변 1, 각도 x인</text>
    <text x="406" y="236" font-size="12.5" fill="#2f7d4f" text-anchor="middle">직각삼각형의 <tspan font-weight="bold">밑변</tspan></text>
  </g>

  <g>
    <rect x="542" y="52" width="226" height="196" rx="4" fill="#ffffff" stroke="#2b6ca3" stroke-width="1.6"/>
    <rect x="542" y="52" width="72" height="26" fill="#2b6ca3"/>
    <text x="578" y="71" font-size="14" fill="#ffffff" text-anchor="middle">tan x</text>
    <path d="M566 190 L736 190 L736 112 z" fill="#8fb8d8" stroke="#2b6ca3" stroke-width="1.4"/>
    <line x1="736" y1="112" x2="736" y2="190" stroke="#2b6ca3" stroke-width="4"/>
    <path d="M570 186 A 26 26 0 0 0 584 178" fill="none" stroke="#191d24" stroke-width="1.2"/>
    <text x="592" y="184" font-size="12" fill="#191d24">x</text>
    <line x1="566" y1="204" x2="736" y2="204" stroke="#191d24" stroke-width="1.2"/>
    <text x="651" y="220" font-size="13" fill="#191d24" text-anchor="middle">1</text>
    <text x="655" y="240" font-size="12.5" fill="#2b6ca3" text-anchor="middle"><tspan font-weight="bold">밑변</tspan> 1, 각도 x인 직각삼각형의 <tspan font-weight="bold">높이</tspan></text>
  </g>

  <rect x="30" y="260" width="738" height="30" rx="4" fill="#e5e7f4" stroke="#3a45a0"/>
  <text x="50" y="280" font-size="13" fill="#191d24">tan만 <tspan fill="#3a45a0">밑변이 1</tspan>인 것에 주의. 그리고 sin·cos이 헷갈리면 — <tspan fill="#3a45a0">각도가 작아질 때 값이 작아지는 쪽이 sin</tspan>입니다.</text>
</svg>
