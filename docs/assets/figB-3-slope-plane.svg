<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect x="1" y="1" width="798" height="318" rx="8" fill="#f7f8f5" stroke="#d6dad1"/>
  <text x="30" y="34" font-size="15" fill="#7b838d">삼각비가 실제로 쓰이는 자리 — 잴 수 없는 길이를 각도로 알아내기</text>

  <g>
    <rect x="30" y="52" width="360" height="234" rx="4" fill="#ffffff" stroke="#d6dad1"/>
    <text x="210" y="78" font-size="13.5" fill="#191d24" text-anchor="middle">경사 8°인 언덕을 100m 걸으면?</text>
    <path d="M60 210 L340 210 L340 172 z" fill="#e4e7df" stroke="#7b838d" stroke-width="1.2"/>
    <path d="M62 206 L338 168" stroke="#191d24" stroke-width="1.6"/>
    <path d="M64 206 A 24 24 0 0 0 78 200" fill="none" stroke="#191d24" stroke-width="1.2"/>
    <text x="88" y="204" font-size="12" fill="#191d24">8°</text>
    <text x="200" y="176" font-size="12.5" fill="#191d24" text-anchor="middle">100미터</text>
    <line x1="348" y1="172" x2="348" y2="210" stroke="#a2661c" stroke-width="2"/>
    <text x="360" y="196" font-size="12" fill="#a2661c">몇 m?</text>

    <rect x="50" y="228" width="320" height="46" rx="4" fill="#e5e7f4" stroke="#3a45a0"/>
    <text x="210" y="248" font-size="13" fill="#191d24" text-anchor="middle">높이 = 100 × sin 8°</text>
    <text x="210" y="266" font-size="13" fill="#3a45a0" text-anchor="middle">= 100 × 0.139 ≈ 약 14미터</text>
  </g>

  <g>
    <rect x="410" y="52" width="358" height="234" rx="4" fill="#ffffff" stroke="#d6dad1"/>
    <text x="589" y="78" font-size="13.5" fill="#191d24" text-anchor="middle">고도 1200m 비행기가 3°로 내려오려면?</text>
    <line x1="436" y1="216" x2="748" y2="216" stroke="#7b838d" stroke-width="1.4"/>
    <path d="M448 118 L736 216 L448 216 z" fill="#dbe8f2" stroke="#2b6ca3" stroke-width="1.4"/>
    <line x1="448" y1="118" x2="448" y2="216" stroke="#2b6ca3" stroke-width="2.4"/>
    <text x="428" y="170" font-size="12" fill="#2b6ca3" text-anchor="end">1200m</text>
    <path d="M452 122 A 22 22 0 0 0 462 134" fill="none" stroke="#191d24" stroke-width="1.2"/>
    <text x="470" y="136" font-size="11.5" fill="#191d24">87°</text>
    <path d="M726 212 A 20 20 0 0 0 718 205" fill="none" stroke="#a2661c" stroke-width="1.2"/>
    <text x="700" y="206" font-size="11.5" fill="#a2661c">3°</text>
    <circle cx="448" cy="118" r="6" fill="#2b6ca3"/>
    <text x="448" y="108" font-size="11.5" fill="#2b6ca3" text-anchor="middle">비행기</text>
    <circle cx="736" cy="216" r="6" fill="#0f7864"/>
    <text x="736" y="236" font-size="11.5" fill="#0f7864" text-anchor="middle">목적지</text>

    <rect x="430" y="248" width="320" height="26" rx="4" fill="#e5e7f4" stroke="#3a45a0"/>
    <text x="590" y="266" font-size="12.5" fill="#191d24" text-anchor="middle">거리 = 1200 × tan 87° ≈ 22,900m = 약 23km</text>
  </g>

  <text x="30" y="306" font-size="12.5" fill="#7b838d">직접 자로 잴 수 없는 길이를, <tspan fill="#3a45a0">각도 하나와 곱셈</tspan>으로 구합니다. 삼각비가 실용적인 이유입니다.</text>
</svg>
